<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>KENNETH Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <main class="admin-shell">
    <section class="login-card" id="loginView">
      <p class="kicker">KENNETH / ADMIN</p>
      <h1>관리자 로그인</h1>
      <p>프로필, 음원 링크, 이미지와 영상을 직접 관리합니다.</p>

      <form id="loginForm">
        <label>
          <span>비밀번호</span>
          <input
            id="passwordInput"
            type="password"
            autocomplete="current-password"
            inputmode="numeric"
            required
          />
        </label>

        <button class="primary-button" type="submit">로그인</button>
      </form>
    </section>

    <section class="dashboard" id="dashboardView" hidden>
      <header class="admin-header">
        <div>
          <p class="kicker">KENNETH / ADMIN</p>
          <h1>콘텐츠 관리</h1>
        </div>

        <div class="header-actions">
          <a href="/" target="_blank" rel="noreferrer">사이트 보기</a>
          <button id="logoutButton" type="button">로그아웃</button>
        </div>
      </header>

      <nav class="tabs" aria-label="관리 메뉴">
        <button class="tab is-active" type="button" data-tab="profile">프로필</button>
        <button class="tab" type="button" data-tab="releases">음원</button>
        <button class="tab" type="button" data-tab="media">영상·링크</button>
      </nav>

      <section class="tab-panel is-active" data-panel="profile">
        <form class="panel-card form-grid" id="profileForm">
          <div class="panel-title">
            <div>
              <span>01</span>
              <h2>프로필과 첫 화면</h2>
            </div>
            <button class="save-button" type="submit">저장</button>
          </div>

          <label>
            <span>표시 이름</span>
            <input name="display_name" type="text" maxlength="60" />
          </label>

          <label>
            <span>역할</span>
            <input name="role" type="text" maxlength="80" />
          </label>

          <label>
            <span>작은 제목</span>
            <input name="hero_eyebrow" type="text" maxlength="80" />
          </label>

          <label>
            <span>메인 제목</span>
            <textarea name="hero_title" rows="2" maxlength="100"></textarea>
            <small>줄바꿈을 넣으면 홈페이지에도 그대로 반영됩니다.</small>
          </label>

          <label>
            <span>소개 문구</span>
            <textarea name="hero_description" rows="3" maxlength="240"></textarea>
          </label>

          <label>
            <span>포인트 색상</span>
            <input name="accent_color" type="color" />
          </label>

          <div
            class="upload-box"
            data-upload-box
            data-folder="hero"
            data-url-input="hero_image_url"
            data-preview="heroPreview"
          >
            <div>
              <strong>메인 이미지</strong>
              <small>JPG, PNG, WEBP · 최대 8MB</small>
            </div>
            <input
              id="heroFile"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/gif"
            />
            <label class="upload-button" for="heroFile">이미지 업로드</label>
            <input name="hero_image_url" type="hidden" />
            <div class="image-preview" id="heroPreview"></div>
          </div>

          <label>
            <span>연락 이메일</span>
            <input name="contact_email" type="email" />
          </label>
        </form>
      </section>

      <section class="tab-panel" data-panel="releases">
        <form class="panel-card form-grid" id="releaseForm">
          <div class="panel-title">
            <div>
              <span>02</span>
              <h2 id="releaseFormTitle">음원 추가</h2>
            </div>
            <button class="save-button" type="submit">저장</button>
          </div>

          <input name="id" type="hidden" />

          <label>
            <span>음원 제목</span>
            <input name="title" type="text" required maxlength="120" />
          </label>

          <div class="two-column">
            <label>
              <span>유형</span>
              <input name="release_type" type="text" value="Single" />
            </label>

            <label>
              <span>발매일</span>
              <input name="release_date" type="date" />
            </label>
          </div>

          <label>
            <span>장르</span>
            <input name="genre" type="text" />
          </label>

          <label>
            <span>설명</span>
            <textarea name="description" rows="3"></textarea>
          </label>

          <div
            class="upload-box"
            data-upload-box
            data-folder="covers"
            data-url-input="cover_url"
            data-preview="coverPreview"
          >
            <div>
              <strong>앨범 자켓</strong>
              <small>직접 업로드한 이미지가 홈페이지에 표시됩니다.</small>
            </div>
            <input
              id="coverFile"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/gif"
            />
            <label class="upload-button" for="coverFile">자켓 업로드</label>
            <input name="cover_url" type="hidden" />
            <div class="image-preview is-square" id="coverPreview"></div>
          </div>

          <label>
            <span>대표 듣기 링크</span>
            <input name="primary_url" type="url" placeholder="https://" />
          </label>

          <label><span>Spotify</span><input name="spotify_url" type="url" /></label>
          <label><span>Apple Music</span><input name="apple_music_url" type="url" /></label>
          <label><span>Melon</span><input name="melon_url" type="url" /></label>
          <label><span>YouTube</span><input name="youtube_url" type="url" /></label>
          <label><span>SoundCloud</span><input name="soundcloud_url" type="url" /></label>
          <label><span>BeatStars</span><input name="beatstars_url" type="url" /></label>

          <div class="two-column">
            <label class="check-label">
              <input name="is_featured" type="checkbox" />
              <span>최신 대표 음원</span>
            </label>

            <label class="check-label">
              <input name="is_published" type="checkbox" checked />
              <span>홈페이지 공개</span>
            </label>
          </div>

          <label>
            <span>정렬 번호</span>
            <input name="sort_order" type="number" min="0" step="1" value="0" />
          </label>

          <div class="form-actions">
            <button class="ghost-button" id="resetReleaseButton" type="button">
              새 음원 입력
            </button>
          </div>
        </form>

        <section class="panel-card">
          <div class="panel-title">
            <div>
              <span>LIST</span>
              <h2>등록된 음원</h2>
            </div>
          </div>

          <div class="release-admin-list" id="releaseAdminList"></div>
        </section>
      </section>

      <section class="tab-panel" data-panel="media">
        <form class="panel-card form-grid" id="mediaForm">
          <div class="panel-title">
            <div>
              <span>03</span>
              <h2>영상과 외부 링크</h2>
            </div>
            <button class="save-button" type="submit">저장</button>
          </div>

          <label><span>Spotify</span><input name="spotify_url" type="url" /></label>
          <label><span>Apple Music</span><input name="apple_music_url" type="url" /></label>
          <label><span>YouTube 채널</span><input name="youtube_url" type="url" /></label>
          <label><span>Instagram</span><input name="instagram_url" type="url" /></label>
          <label><span>Melon</span><input name="melon_url" type="url" /></label>
          <label><span>SoundCloud</span><input name="soundcloud_url" type="url" /></label>
          <label><span>BeatStars</span><input name="beatstars_url" type="url" /></label>

          <div class="divider"></div>

          <label>
            <span>최신 영상 제목</span>
            <input name="video_title" type="text" />
          </label>

          <label>
            <span>YouTube 영상 링크</span>
            <input name="video_url" type="url" />
          </label>

          <div
            class="upload-box"
            data-upload-box
            data-folder="videos"
            data-url-input="video_thumbnail_url"
            data-preview="videoPreview"
          >
            <div>
              <strong>영상 썸네일</strong>
              <small>YouTube 자동 썸네일 대신 직접 업로드합니다.</small>
            </div>
            <input
              id="videoFile"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/gif"
            />
            <label class="upload-button" for="videoFile">썸네일 업로드</label>
            <input name="video_thumbnail_url" type="hidden" />
            <div class="image-preview" id="videoPreview"></div>
          </div>

          <div class="divider"></div>

          <label>
            <span>ONYOUR 제목</span>
            <input name="onyour_title" type="text" />
          </label>

          <label>
            <span>ONYOUR 설명</span>
            <textarea name="onyour_description" rows="3"></textarea>
          </label>

          <label>
            <span>ONYOUR 홈페이지</span>
            <input name="onyour_url" type="url" />
          </label>

          <div
            class="upload-box"
            data-upload-box
            data-folder="onyour"
            data-url-input="onyour_image_url"
            data-preview="onyourPreview"
          >
            <div>
              <strong>ONYOUR 이미지</strong>
              <small>팀 로고나 대표 이미지를 직접 업로드합니다.</small>
            </div>
            <input
              id="onyourFile"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/gif"
            />
            <label class="upload-button" for="onyourFile">이미지 업로드</label>
            <input name="onyour_image_url" type="hidden" />
            <div class="image-preview" id="onyourPreview"></div>
          </div>
        </form>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
